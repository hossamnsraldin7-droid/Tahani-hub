<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahani Hub</title>
  <meta name="description" content="منصة متكاملة لتهاني المناسبات، توفر رسائل وصور مميزة لأعياد الميلاد، الزواج، النجاح، والتخرج، مع إمكانية المشاركة بسهولة.">
  <link rel="stylesheet" href="s.css">
  <link rel="stylesheet" href="themes.css">
</head>

<body class="light-theme">

<div class="topbar">
  <span class="menu-icon" onclick="toggleMenu()">☰</span>

  <div class="actions">
    <button onclick="toggleLang()" id="langBtn">EN</button>
    <button id="toggleDark">🌙</button>
  </div>
</div>

<div id="sidebar" class="sidebar">
  <h3>المناسبة...</h3>
  <ul id="categoryList"></ul>
</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div class="content">
  <input type="text" id="search" placeholder="ابحث عن مناسبة..." oninput="searchCategories()">
  <div id="messages"></div>
</div>

<script src="script.js"></script>
</body>
</html>
